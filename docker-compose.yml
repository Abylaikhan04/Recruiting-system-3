networks:
  app:
    driver: bridge

volumes:
  db_data:
    driver: local
  backend_vendor:
    driver: local

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: rf_db
    restart: unless-stopped
    networks: [app]
    environment:
      POSTGRES_DB:       ${DB_DATABASE:-recruitflow}
      POSTGRES_USER:     ${DB_USERNAME:-recruitflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ── PHP-FPM (Laravel) ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: rf_backend
    restart: unless-stopped
    networks: [app]
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV:      ${APP_ENV:-local}
      APP_DEBUG:    ${APP_DEBUG:-true}
      APP_URL:      ${APP_URL:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      DB_HOST:     db
      DB_PORT:     5432
      DB_DATABASE: ${DB_DATABASE:-recruitflow}
      DB_USERNAME: ${DB_USERNAME:-recruitflow}
      DB_PASSWORD: ${DB_PASSWORD:-secret}

  # ── Nginx → PHP-FPM ──────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: rf_nginx
    restart: unless-stopped
    networks: [app]
    volumes:
      - ./backend:/var/www:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8000:80"
    depends_on:
      - backend

  # ── Frontend SPA (React build → nginx) ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: rf_frontend
    restart: unless-stopped
    networks: [app]
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - nginx
